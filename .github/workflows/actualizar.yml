name: Actualizar datos y publicar

on:
  schedule:
    # Horas en UTC. 05:20 UTC = 06:20 (invierno) / 07:20 (verano) en Madrid.
    - cron: "20 5 * * *"
    # Segunda pasada de respaldo: GitHub a veces se salta ejecuciones programadas.
    - cron: "20 11 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano
  push:
    branches: [main]      # al cambiar la web, se vuelve a publicar

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar y regenerar los datos
        working-directory: scripts
        run: python actualizar.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add site/data ref
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos del $(TZ=Europe/Madrid date +%Y-%m-%d)"
            git push
          fi

  publicar:
    needs: actualizar
    if: always() && (needs.actualizar.result == 'success' || needs.actualizar.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # incluye el commit de datos que acaba de hacer el paso anterior
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
